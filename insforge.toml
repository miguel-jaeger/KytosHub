[auth]
allowed_redirect_urls = ["https://kytos-hub.vercel.app", "http://localhost:3000", "http://localhost:5173"]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
username = "miguel.jaeger@gmail.com"
password = "env(SMTP_PASSWORD)"
sender_email = "miguel.jaeger@gmail.com"
sender_name = "KytosHub"
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
