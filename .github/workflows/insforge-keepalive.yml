name: InsForge Keep-Alive

# InsForge pausa los proyectos gratuitos tras 7 días sin actividad.
#
# Importante: /api/health puede responder 200 sin marcar el proyecto como
# activo, porque los health checks no se consideran tráfico de producto.
# Por eso, además del health check, invocamos la función `keepalive`, que
# registra la ejecución en public.keepalive_runs (actividad real de función
# y de base de datos).
#
# Nota: GitHub desactiva automáticamente los workflows programados tras
# 60 días sin actividad en el repositorio (commits, PRs, issues). Si eso
# ocurre, basta con hacer un commit o reactivarlo desde la pestaña Actions.

on:
  schedule:
    # Todos los días a las 09:17 UTC.
    # Se evita el minuto 0 porque GitHub retrasa/descarta más los crons que
    # coinciden con el inicio de la hora.
    - cron: "17 9 * * *"
    # Respaldo adicional cada 5 días a las 14:47 UTC.
    - cron: "47 14 */5 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: insforge-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Mantener InsForge activo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Puedes sobreescribir la URL desde Settings > Variables > Actions.
      INSFORGE_URL: ${{ vars.INSFORGE_URL || 'https://5vvsyy6z.us-east.insforge.app' }}
    steps:
      - name: Comprobar salud del backend
        shell: bash
        run: |
          set -euo pipefail

          health_url="$INSFORGE_URL/api/health"
          echo "Health check: $health_url"
          echo "Fecha: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          response=$(curl -fsS \
            --max-time 60 \
            --retry 5 \
            --retry-delay 20 \
            --retry-all-errors \
            -w '\n%{http_code}' \
            "$health_url")

          status=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::InsForge respondió al health check con HTTP $status"
            exit 1
          fi

          {
            echo "### InsForge Keep-Alive"
            echo ""
            echo "- **Health check:** \`$health_url\`"
            echo "- **HTTP:** \`$status\`"
            echo "- **Respuesta:** \`$body\`"
            echo "- **Ejecutado:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar actividad del cron
        shell: bash
        run: |
          set -euo pipefail

          activity_url="$INSFORGE_URL/functions/keepalive?source=github"
          echo "Actividad real: $activity_url"

          response=$(curl -sS \
            --max-time 60 \
            --retry 5 \
            --retry-delay 20 \
            --retry-all-errors \
            -H "Accept: application/json" \
            -w '\n%{http_code}' \
            "$activity_url")

          status=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::La función keepalive respondió con HTTP $status (se esperaba 200)"
            exit 1
          fi

          {
            echo ""
            echo "### Actividad registrada"
            echo ""
            echo "- **Endpoint:** \`$activity_url\`"
            echo "- **HTTP:** \`$status\`"
            echo "- **Respuesta:** \`$body\`"
            echo "- **Ejecutado:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
